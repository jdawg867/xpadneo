name: Kernel Compatibility

on:
  push:
    branches:
      - development
      - 'feature/**'
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-build:
    name: Build ${{ matrix.kernel }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        kernel:
          - 6.8.0-138-generic
          - 5.15.0-203-generic

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            kmod \
            "linux-headers-${{ matrix.kernel }}"

      - name: Verify kernel headers
        shell: bash
        env:
          KERNEL: ${{ matrix.kernel }}
        run: |
          set -euo pipefail

          HEADER_DIR="/usr/src/linux-headers-$KERNEL"
          BUILD_LINK="/lib/modules/$KERNEL/build"

          test -d "$HEADER_DIR"

          if [[ ! -e "$BUILD_LINK" ]]; then
            sudo mkdir -p "/lib/modules/$KERNEL"
            sudo ln -s "$HEADER_DIR" "$BUILD_LINK"
          fi

          test -f "$BUILD_LINK/Makefile"

          echo "PASS: headers available for $KERNEL"

      - name: Build and validate module
        shell: bash
        env:
          KERNEL: ${{ matrix.kernel }}
          XPADNEO_TEST_REPORT_DIR: ${{ runner.temp }}/kernel-reports
          XPADNEO_TEST_JOBS: "4"
        run: |
          set -euo pipefail

          bash tests/kernel-compat-build.sh "$KERNEL"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ matrix.kernel }}
          path: ${{ runner.temp }}/kernel-reports/
          if-no-files-found: warn
          retention-days: 14
